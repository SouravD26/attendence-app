name: attendence
description: "Sanmarg HRMS attendance app."
publish_to: 'none'

version: 2.0.0+6

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.0
  geolocator: ^13.0.1
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  camera: ^0.12.1
  geocoding: ^5.0.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
